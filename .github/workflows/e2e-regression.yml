name: E2E Regression Tests

on:
  # Trigger on merge to main branch  
  push:
    branches: [ main ]
  
  # Trigger on pull requests to main
  pull_request:
    branches: [ main ]
    
  # Nightly schedule at 2:00 AM Moscow time (23:00 UTC)
  schedule:
    - cron: '0 23 * * *'
    
  # Allow manual trigger
  workflow_dispatch:

env:
  TEST_URL: https://etl-tst.chococraft.ru
  BASIC_AUTH_USER: admin
  BASIC_AUTH_PASS: password

jobs:
  # Job 1: Feature E2E Test (E12-A)
  feature_e2e:
    name: Feature E2E Test (E12-A)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install requests pytest structlog
          
      - name: Wait for system to be ready
        run: |
          echo "Waiting for system readiness..."
          for i in {1..30}; do
            if curl -s -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASS" "$TEST_URL/api/v1/health" > /dev/null; then
              echo "System is ready"
              break
            fi
            echo "Attempt $i: System not ready, waiting 10 seconds..."
            sleep 10
          done
          
      - name: Run Feature E2E Test
        id: feature_test
        run: |
          python3 scripts/e2e_feature_test.py
        env:
          TEST_URL: ${{ env.TEST_URL }}
          BASIC_AUTH_USER: ${{ env.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ env.BASIC_AUTH_PASS }}
          
      - name: Generate Feature E2E Report
        if: always()
        run: |
          mkdir -p e2e-reports
          python3 scripts/generate_e2e_report.py feature ${{ steps.feature_test.outcome }} > e2e-reports/feature_e2e_report_$(date +%Y%m%d_%H%M%S).md
          
      - name: Upload Feature E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-e2e-report
          path: e2e-reports/
          retention-days: 30
          
      - name: Check Feature E2E Result
        if: steps.feature_test.outcome == 'failure'
        run: |
          echo "Feature E2E test failed"
          exit 1

  # Job 2: Task E2E Test (E12-B)  
  task_e2e:
    name: Task E2E Test (E12-B)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install requests pytest structlog
          
      - name: Wait for system to be ready
        run: |
          echo "Waiting for system readiness..."
          for i in {1..30}; do
            if curl -s -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASS" "$TEST_URL/api/v1/health" > /dev/null; then
              echo "System is ready"
              break
            fi
            echo "Attempt $i: System not ready, waiting 10 seconds..."
            sleep 10
          done
          
      - name: Run Task E2E Test
        id: task_test
        run: |
          python3 scripts/e2e_task_test.py
        env:
          TEST_URL: ${{ env.TEST_URL }}
          BASIC_AUTH_USER: ${{ env.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ env.BASIC_AUTH_PASS }}
          
      - name: Generate Task E2E Report
        if: always()
        run: |
          mkdir -p e2e-reports
          python3 scripts/generate_e2e_report.py task ${{ steps.task_test.outcome }} > e2e-reports/task_e2e_report_$(date +%Y%m%d_%H%M%S).md
          
      - name: Upload Task E2E Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-e2e-report
          path: e2e-reports/
          retention-days: 30
          
      - name: Check Task E2E Result
        if: steps.task_test.outcome == 'failure'
        run: |
          echo "Task E2E test failed"
          exit 1

  # Job 3: Publish Nightly Report (only for scheduled runs)
  publish_nightly_report:
    name: Publish Nightly Report
    runs-on: ubuntu-latest
    needs: [feature_e2e, task_e2e]
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Feature E2E Report
        uses: actions/download-artifact@v4
        with:
          name: feature-e2e-report
          path: e2e-reports/
          
      - name: Download Task E2E Report  
        uses: actions/download-artifact@v4
        with:
          name: task-e2e-report
          path: e2e-reports/
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Generate Consolidated Nightly Report
        run: |
          python3 scripts/generate_nightly_report.py
          
      - name: Commit and Push Nightly Report
        run: |
          git config --local user.email "ci@feature-factory.local"
          git config --local user.name "E2E CI Bot"
          git add docs/_bundle/
          git commit -m "📊 Nightly E2E regression report $(date +%Y-%m-%d)

          🤖 Generated with CI/CD Pipeline
          
          Co-Authored-By: E2E Bot <noreply@feature-factory.local>" || echo "No changes to commit"
          git push || echo "No changes to push"
          
      - name: Log E2E Regression Event
        run: |
          python3 scripts/log_e2e_event.py e2e_regression_nightly

  # Job 4: Send Alerts on Failure
  send_alert:
    name: Send Failure Alert
    runs-on: ubuntu-latest
    needs: [feature_e2e, task_e2e]
    if: failure()
    
    steps:
      - name: Send Slack Alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🚨 E2E Regression Tests Failed\\n\\nCommit: ${{ github.sha }}\\nBranch: ${{ github.ref_name }}\\nWorkflow: ${{ github.run_id }}\\n\\nCheck details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              $SLACK_WEBHOOK_URL
          else
            echo "SLACK_WEBHOOK_URL not configured, skipping alert"
          fi
          
      - name: Log Failure Event
        run: |
          echo "E2E Regression test failure logged at $(date)"
          # Here you could add additional logging to your system