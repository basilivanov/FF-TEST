# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast
        name: check python ast

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        name: black (python)

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        name: flake8
        args: [--max-line-length=88, --ignore=E203,W503]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)

  # QA Guard - Custom quality rules
  - repo: local
    hooks:
      - id: qa-guard
        name: QA Guard - Quality Rules
        entry: scripts/qa_guard.sh
        language: script
        files: \.(py|yaml|yml)$
        pass_filenames: true
        stages: [commit, push]

  # Custom hook for running index on changed Python files
  - repo: local
    hooks:
      - id: update-index
        name: update-index
        entry: make index
        language: system
        types: [python]
        pass_filenames: false
        always_run: false