# === FeatureFactory nginx globals (HTTP level) ===

# 1) Upstream бэкенда (порт 8081)
upstream ff_backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

# 2) Корреляция: если заголовок не пришёл — берём $request_id
map $http_x_correlation_id $corr_id {
    ""      $request_id;
    default $http_x_correlation_id;
}

# 3) Зона ограничения скорости (20 req/min на IP)
#    limit_req_zone ОБЯЗАТЕЛЬНО в http{}, а не в server{}
limit_req_zone $binary_remote_addr zone=ff_ctx_limiter:10m rate=20r/m;
