<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .event-node { fill: #4ade80; }
    .event-node.warn { fill: #facc15; }
    .event-node.error { fill: #f87171; }
    .event-time { font-family: Arial, sans-serif; font-size: 12px; fill: #6b7280; }
    .event-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1f2937; }
    .event-description { font-family: Arial, sans-serif; font-size: 12px; fill: #6b7280; }
    .button { font-family: Arial, sans-serif; font-size: 12px; fill: #1f2937; }
    .details-box { fill: #f9fafb; stroke: #e5e7eb; }
    .details-text { font-family: monospace; font-size: 11px; fill: #374151; }
  </style>
  
  <!-- Timeline line -->
  <line x1="50" y1="0" x2="50" y2="600" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Event 1: Task started -->
  <circle cx="50" cy="50" r="8" class="event-node"/>
