<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background-color: #e3f2fd; text-align: right; }
        .assistant { background-color: #f3e5f5; }
        .system { background-color: #e8f5e8; }
        .error { background-color: #ffebee; color: #d32f2f; }
        input[type="text"] { width: 70%; padding: 10px; }
        button { padding: 10px 20px; margin-left: 10px; }
        .status { margin: 10px 0; font-weight: bold; }
        .connected { color: green; }
        .disconnected { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Тест WebSocket чата Maintainer</h1>
        <div id="status" class="status disconnected">Отключено</div>
        
        <div id="messages" style="height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin: 20px 0;">
        </div>
        
        <div>
            <input type="text" id="messageInput" placeholder="Введите сообщение..." />
            <button onclick="sendMessage()">Отправить</button>
            <button onclick="connect()">Подключиться</button>
            <button onclick="disconnect()">Отключиться</button>
        </div>
    </div>

    <script>
        let ws = null;
        let sessionId = null;

        function addMessage(role, content, isError = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            if (isError) messageDiv.className += ' error';
            messageDiv.innerHTML = `<strong>${role}:</strong> ${content}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = connected ? 'Подключено' : 'Отключено';
            statusDiv.className = `status ${connected ? 'connected' : 'disconnected'}`;
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('system', 'Уже подключен');
                return;
            }

            const wsUrl = 'ws://localhost:8081/ws/v1/chat/maintainer';
            addMessage('system', `Подключаемся к ${wsUrl}`);
            
            ws = new WebSocket(wsUrl);

            ws.onopen = function(event) {
                updateStatus(true);
                addMessage('system', 'WebSocket подключен');
                
                // Отправляем handshake
                const handshake = {
                    type: 'handshake',
                    session_id: sessionId,
                    analyst_type: 'BUSINESS'
                };
                ws.send(JSON.stringify(handshake));
                addMessage('system', 'Отправлен handshake');
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('Received:', data);
                    
                    if (data.type === 'connected') {
                        sessionId = data.session_id;
                        addMessage('system', `Сессия установлена: ${sessionId}`);
                        
                        // Восстанавливаем историю
                        if (data.history && data.history.length > 0) {
                            addMessage('system', `Восстановлена история из ${data.history.length} сообщений`);
                            data.history.forEach(msg => {
                                addMessage(msg.role, msg.content);
                            });
                        }
                    } else if (data.type === 'error') {
                        addMessage('system', data.response || 'Ошибка сервера', true);
                    } else if (data.response) {
                        addMessage('assistant', data.response);
                    }
                } catch (e) {
                    addMessage('system', `Ошибка парсинга: ${e.message}`, true);
                }
            };

            ws.onerror = function(error) {
                addMessage('system', `WebSocket ошибка: ${error}`, true);
            };

            ws.onclose = function(event) {
                updateStatus(false);
                addMessage('system', `WebSocket закрыт. Код: ${event.code}, Причина: ${event.reason || 'неизвестно'}`);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                addMessage('system', 'Введите сообщение', true);
                return;
            }
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('system', 'WebSocket не подключен', true);
                return;
            }

            const payload = {
                message: message,
                session_id: sessionId,
                analyst_type: 'BUSINESS'
            };

            ws.send(JSON.stringify(payload));
            addMessage('user', message);
            input.value = '';
        }

        // Отправка по Enter
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Автоподключение при загрузке
        window.onload = function() {
            connect();
        };
    </script>
</body>
</html>
